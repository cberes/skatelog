{% for t in tricks %}
    <tr>
        <td>{{ t.day }}</td>
        <td>{{ t.count }}</td>
        <td>{{ t.stance }}</td>
        <td>{{ t.name }}</td>
        <td>{{ t.surface or "-" }}</td>
        {% if editable %}
            <td hx-delete="/api/v1/tricks/{{ t.id }}" class="clickable">🗑️</td>
        {% endif %}
    </tr>
{% endfor %}
