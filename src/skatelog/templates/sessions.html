<!doctype html>
<html>

<head>
	<title>Skatelog</title>
	<script src="https://unpkg.com/htmx.org@2"></script>
	<script src="https://unpkg.com/htmx-ext-json-enc@2.0.1/json-enc.js"></script>
	<link rel="stylesheet" href="https://unpkg.com/simpledotcss/simple.min.css">
	<style>
		tr.htmx-swapping td {
			opacity: 0;
			transition: opacity 1s ease-out;
		}

		td.clickable:hover {
			cursor: pointer;
		}
	</style>
</head>

<body>
	<header>
		<nav id="top">
			<a href="/">Dashboard</a>
			<a href="/sessions" class="current">Sessions</a>
			<a href="/tricks">Tricks</a>
		</nav>
		<h1>Skatelog</h1>
		<p>Track your skateboard sessions</p>
	</header>
	<main>

		<h2>Sessions</h2>

		<h3>Add a session</h3>

		<form id="add-session" hx-post="/api/v1/sessions" hx-swap="none" hx-ext="json-enc"
			hx-on::after-request="if(event.detail.successful) this.reset()">
			<p>
				<label for="day">Day</label>
				<input type="date" id="day" name="day" value="{{ today }}">
			</p>

			<p>
				<label for="where">Where</label>
				<select id="where" name="where">
					{% with options=locations, selected=location_last %}
					{% include "_options.html" %}
					{% endwith %}
				</select>
				<button id="add-location" title="Add new location">Add</button>
			</p>

			<p>
				<label for="shoe">Shoe</label>
				<select id="shoe" name="shoe">
					{% with options=shoes, selected=shoe_last %}
					{% include "_options.html" %}
					{% endwith %}
				</select>
				<button id="add-shoe" title="Add new shoe">Add</button>
			</p>

			<p>
				<label for="board">Board</label>
				<select id="board" name="board">
					{% with options=boards, selected=board_last %}
					{% include "_options.html" %}
					{% endwith %}
				</select>
				<button id="add-board" title="Add new board">Add</button>
			</p>

			<p>
				<label for="notes">Notes</label>
				<input type="text" id="notes" name="notes">
			</p>

			<p>
				{% with options=disciplines %}
				{% include "_checks.html" %}
				{% endwith %}
			</p>

			<button title="Save this session">Add</button>
			<button type="reset">Reset</button>
		</form>

		<h3>Sessions list</h3>

		<form hx-get="/refresh-sessions" hx-target="#sessions" hx-swap="innerHTML"
			hx-trigger="change, input delay:500ms, htmx:afterRequest from:#add-session">
			<label for="month">Filter by date:</label>

			<select id="month" name="month">
				{% include "_months.html" %}
			</select>

			<input type="number" id="year" name="year" value="2026">
		</form>

		<table>
			<thead>
				<tr>
					<th>Day</th>
					<th>Disciplines</th>
					<th>Where</th>
					<th>Shoe</th>
					<th>Board</th>
					<th>Notes</th>
					<th>&nbsp;</th>
				</tr>
			</thead>
			<tbody id="sessions" hx-confirm="Delete this session?" hx-target="closest tr"
				hx-swap="outerHTML swap:200ms">
				{% include "_session_rows.html" %}
			</tbody>
		</table>
	</main>

	<script>
		(function (w, d) {
			function addNewOption(selectId) {
				const select = d.getElementById(selectId);
				return function (event) {
					event.preventDefault();
					const newText = prompt('Enter the new option:');
					if (!newText || newText.trim() === '') {
						return;
					}
					const newOption = d.createElement('option');
					newOption.text = newText.trim();
					select.add(newOption);
					newOption.selected = true;
				}
			}

			d.getElementById('add-location').addEventListener('click', addNewOption('where'));
			d.getElementById('add-shoe').addEventListener('click', addNewOption('shoe'));
			d.getElementById('add-board').addEventListener('click', addNewOption('board'));
		}(window, document));
	</script>

</body>

</html>
